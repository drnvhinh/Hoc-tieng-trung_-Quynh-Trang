  <script>
    /* Nạp lần lượt từng file: thử trong thư mục con trước, không có thì lấy ở thư mục gốc. */
    (function () {
      var files = [['data/', 'lessons.js'], ['data/', 'examples.js'], ['data/', 'chars.js'], ['js/', 'app.js']];
      function load(i) {
        if (i >= files.length) return;
        var tryLoad = function (src, fallback) {
          var s = document.createElement('script');
          s.src = src;
          s.onload = function () { load(i + 1); };
          s.onerror = function () { s.remove(); if (fallback) tryLoad(fallback, null); };
          document.body.appendChild(s);
        };
        tryLoad(files[i][0] + files[i][1], files[i][1]);
      }
      load(0);
    })();
  </script>
